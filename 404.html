<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found - Riftbound Database</title>
<link rel="icon" type="image/png" sizes="512x512" href="/logo-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#13151c;--panel:#1b1e28;--fg:#e8e9ee;--muted:#9097a9;--line:#2e3342;--accent:#8fc25a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:16px/1.5 Barlow,system-ui,sans-serif}
main{width:100%;max-width:420px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 24px}
img{width:72px;height:72px;border-radius:14px}
h1{font-family:"Chakra Petch",sans-serif;font-size:24px;margin:16px 0 6px}
p{color:var(--muted);margin:0 0 22px}
a{display:inline-block;background:var(--accent);color:#13151c;font-family:"Chakra Petch",sans-serif;font-weight:700;text-decoration:none;padding:10px 20px;border-radius:8px}
a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<main>
  <img src="/logo-512.png" alt="">
  <h1>Page Not Found</h1>
  <p>There's nothing at this address. The card database is on the main page.</p>
  <a href="/">Go to Riftbound Database</a>
</main>
</body>
</html>
