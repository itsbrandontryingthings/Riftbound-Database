name: Daily prices
# Refreshes prices.js (TCGplayer market + lowest prices, regular and foil, and 7/30-day changes) from tcgcsv.com every
# day after it updates (~20:00 UTC), or when run by hand. Keeps the price history in build/prices/history.json.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 21 * * *"
  push:
    branches: [main]
    paths: [tools/fetch_prices.py, .github/workflows/prices.yml]
permissions:
  contents: write
concurrency: { group: prices, cancel-in-progress: false }
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add prices.js build/prices/history.json
          git diff --cached --quiet || (git commit -m "Daily prices from TCGplayer (tcgcsv)" && git pull --rebase -q origin main && git push)
