<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riftbound Database link preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow:wght@500;600&display=swap">
<style>
  /* The picture Discord, iMessage, etc. show for a link to the site (1200 x 630). Made into og-image.jpg by render.py.
     Centre card: Shen - Eye of Twilight, overnumbered (VEN 193, the "armpit Shen"), no foil shine (Brandon's pick). */
  :root{--bg:#13151c;--panel:#1b1e28;--line:#2e3342;--fg:#e8e9ee;--muted:#9097a9;--accent:#8fc25a;
        --fury:#e0605a;--calm:#5cc28d;--mind:#4f93db;--body:#e08a3a;--chaos:#a46fd8;--order:#d9c24f}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:radial-gradient(900px 520px at 88% 50%,#262b3a 0%,var(--bg) 70%);color:var(--fg);font-family:Barlow,"Segoe UI",sans-serif;position:relative}
  .text{position:absolute;left:64px;top:0;bottom:0;width:500px;display:flex;flex-direction:column;justify-content:center;gap:20px}
  .brand{display:flex;align-items:center;gap:20px}
  /* the RBDB logo, same look as logo.html */
  .logo{width:92px;height:92px;border-radius:20px;position:relative;overflow:hidden;flex:none;
        background:linear-gradient(150deg,#262b3a 0%,#13151c 75%);box-shadow:inset 0 0 0 2px #2e3342,0 8px 22px rgb(0 0 0 / .45);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        font-family:"Chakra Petch";font-weight:700;font-size:37px;line-height:.86;letter-spacing:.02em}
  .logo .rb{color:var(--fg)} .logo .db{color:var(--accent)}
  .logo .stripe{position:absolute;left:14px;right:14px;bottom:11px;height:3px;border-radius:2px;
          background:linear-gradient(90deg,var(--fury) 0 16.6%,var(--calm) 0 33.3%,var(--mind) 0 50%,var(--body) 0 66.6%,var(--chaos) 0 83.3%,var(--order) 0)}
  .eyebrow{font-family:"Chakra Petch";font-weight:600;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);line-height:1.2}
  .eyebrow small{display:block;font-size:17px;letter-spacing:.12em;color:var(--muted)}
  h1{font-family:"Chakra Petch";font-weight:700;font-size:80px;line-height:.98;letter-spacing:-.01em}
  .sub{font-size:24px;line-height:1.4;color:var(--muted);font-weight:500}
  .sub b{color:var(--fg);font-weight:600}
  .dots{display:flex;gap:10px;margin-top:4px}
  .dots i{width:16px;height:16px;border-radius:50%}
  .url{font-family:"Chakra Petch";font-weight:600;font-size:24px;color:var(--fg);opacity:.85}
  .fan{position:absolute;right:-6px;top:50%;width:620px;height:560px;transform:translateY(-50%)}
  .fan .c{position:absolute;width:228px;aspect-ratio:744/1039;border-radius:13px;overflow:hidden;transform-origin:50% 120%;
          box-shadow:0 18px 40px rgb(0 0 0 / .55),0 0 0 1px rgb(255 255 255 / .08)}
  .fan .c img{width:100%;height:100%;object-fit:cover;display:block}
  .fan .c:nth-child(1){left:40px;top:120px;transform:rotate(-18deg)}
  .fan .c:nth-child(2){left:120px;top:72px;transform:rotate(-9deg)}
  .fan .c:nth-child(4){left:290px;top:72px;transform:rotate(9deg);z-index:2}
  .fan .c:nth-child(5){left:370px;top:120px;transform:rotate(18deg);z-index:1}
  /* the star: a bit bigger, in front, with a rainbow foil shine like foil cards on the site */
  .fan .c.star{left:192px;top:26px;width:244px;z-index:4;transform:rotate(0deg);
               box-shadow:0 22px 50px rgb(0 0 0 / .65),0 0 0 2px rgb(255 255 255 / .18)}
  .foil{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.42;
        background:linear-gradient(115deg,transparent 18%,rgb(255 90 120 / .55) 30%,rgb(255 210 90 / .55) 38%,rgb(120 255 160 / .5) 46%,rgb(90 200 255 / .55) 54%,rgb(190 120 255 / .55) 62%,transparent 74%)}
  .gleam{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
         background:linear-gradient(115deg,transparent 34%,rgb(255 255 255 / .42) 44%,transparent 54%),
                    repeating-linear-gradient(115deg,rgb(255 255 255 / .06) 0 2px,transparent 2px 6px)}
</style>
</head>
<body>
  <div class="text">
    <div class="brand"><div class="logo"><span class="rb">RB</span><span class="db">DB</span><i class="stripe"></i></div><div class="eyebrow">Riftbound TCG<small>RiftBound DataBase</small></div></div>
    <h1>Riftbound<br>Database</h1>
    <p class="sub">Every card, printing &amp; price in <b>CAD + USD</b>.<br>Track your collection, check decks, trade with friends.</p>
    <div class="dots"><i style="background:var(--fury)"></i><i style="background:var(--calm)"></i><i style="background:var(--mind)"></i><i style="background:var(--body)"></i><i style="background:var(--chaos)"></i><i style="background:var(--order)"></i></div>
    <div class="url">rbdatabase.pages.dev</div>
  </div>
  <div class="fan">
    <div class="c"><img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/6a06599a299b15175984c1e38d27a3be21258fbe-1488x2078.png?accountingTag=RB&w=600&fm=webp&q=92" alt="Yasuo"></div>
    <div class="c"><img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/ae8e68af43400f61f7391c0a6ee339fd718a7540-1488x2078.png?accountingTag=RB&w=600&fm=webp&q=92" alt="Kai'Sa"></div>
    <div class="c star"><img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/8c234c7efc30a24dc50c4b76517857bff6e1f906-744x1039.png?accountingTag=RB&fm=webp&q=92" alt="Shen - Eye of Twilight"></div>
    <div class="c"><img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/e5fe571a8f09c0a9e76345ec32b446480f54617c-1488x2078.png?accountingTag=RB&w=600&fm=webp&q=92" alt="Ahri"></div>
    <div class="c"><img src="https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/30bed82f66ce9e4eae260d029d92c9d8cb1588ab-1488x2078.png?accountingTag=RB&w=600&fm=webp&q=92" alt="Jinx"></div>
  </div>
</body>
</html>
