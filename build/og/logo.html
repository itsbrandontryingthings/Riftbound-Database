<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RBDB logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap">
<style>
  /* The RBDB logo (RiftBound DataBase), 512 x 512. Made into logo-512.png by render.py; og.html uses the same look. */
  *{box-sizing:border-box;margin:0}
  html,body{width:512px;height:512px;overflow:hidden;background:transparent}
  .logo{width:512px;height:512px;border-radius:112px;position:relative;overflow:hidden;
        background:linear-gradient(150deg,#262b3a 0%,#13151c 75%);box-shadow:inset 0 0 0 10px #2e3342;
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:208px;line-height:.86;letter-spacing:.02em}
  .rb{color:#e8e9ee}
  .db{color:#8fc25a}
  .stripe{position:absolute;left:80px;right:80px;bottom:62px;height:16px;border-radius:8px;
          background:linear-gradient(90deg,#e0605a 0 16.6%,#5cc28d 0 33.3%,#4f93db 0 50%,#e08a3a 0 66.6%,#a46fd8 0 83.3%,#d9c24f 0)}
</style>
</head>
<body>
  <div class="logo"><span class="rb">RB</span><span class="db">DB</span><i class="stripe"></i></div>
</body>
</html>
